name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test data persistence, migration, and text formatting
        run: swift test
      - name: Resolve release version
        shell: bash
        run: |
          version="$(< VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" == "$(< VERSION)" ]] || { echo "Tag must match VERSION"; exit 1; }
          fi
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ticket-organizer-macos
          path: |
            dist/Ticket-Organizer-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Prepare draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          body: |
            Universal macOS 14+ build for Apple Silicon and Intel.
            This build is ad-hoc signed, not Apple Developer ID signed or notarized.
            Complete Developer ID signing and notarization before public distribution.
          files: |
            dist/Ticket-Organizer-*.zip
            dist/SHA256SUMS
